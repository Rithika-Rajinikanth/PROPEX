name: PropX DevOps CI/CD & Reliability Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-check:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust Toolchain Setup
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Formatting & Clippy
        run: |
          cd backend/real_estate_api
          cargo fmt -- --check
          cargo clippy -- -D warnings

      - name: Python ML Linting
        run: |
          pip install flake8
          cd ml_service
          flake8 --max-line-length=120 --ignore=E501,W503 --exclude=venv,.venv,pgvector .

      - name: Frontend Next.js Lint
        run: |
          cd frontend/real-estate-frontend
          npm ci
          npm run lint

  integration-tests:
    name: Database, Concurrency & Chaos Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: propx_exchange
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: Postgres@123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Seed Database Schema
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD="Postgres@123" psql -h localhost -U postgres -d propx_exchange -f backend/real_estate_api/propx_schema.sql

      - name: Run Backend Rust Tests
        env:
          DATABASE_URL: postgres://postgres:Postgres@123@localhost:5432/propx_exchange?sslmode=disable
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_secret_key_ci_cd_32chars_long_1234
        run: |
          cd backend/real_estate_api
          cargo test --bin real_estate_api -- --nocapture

      - name: Run Concurrency & Stress Tests
        run: |
          pip install requests psycopg2-binary
          python tests/devops_concurrency_stress_test.py || true

  docker-build:
    name: Multi-Stage Container Verification
    runs-on: ubuntu-latest
    needs: [lint-and-check, integration-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Rust Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/real_estate_api
          file: ./backend/real_estate_api/backend.Dockerfile
          push: false
          tags: propx-backend:ci

      - name: Build Next.js Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend/real-estate-frontend
          file: ./frontend/real-estate-frontend/frontend.Dockerfile
          push: false
          tags: propx-frontend:ci
