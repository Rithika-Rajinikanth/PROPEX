[package]
name = "real_estate_api"
version = "0.1.0"
edition = "2024"

[dependencies]
# Web framework
axum = "0.8.8"
# Cargo.toml
async-trait = "0.1"

erased-serde = "0.4"
tokio = { version = "1", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.6.8", features = ["fs", "trace", "cors","compression-gzip", "catch-panic"] }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "macros", "chrono", "migrate", ] }
rust_decimal = { version = "1.33", features = ["serde"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Validation
validator = { version = "0.20.0", features = ["derive"] }

# Caching
redis = { version = "1.0.2", features = ["tokio-comp", "connection-manager"] }

# Authentication & Security
jsonwebtoken = { version = "10.2.0", features = ["rust_crypto"] }
bcrypt = "0.18.0"
argon2 = "0.5"

# Configuration
dotenv = "0.15"
config = "0.15.19"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0.18"

# API Documentation
utoipa = { version = "5.4.0", features = ["axum_extras", "chrono"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }

# HTTP Client (for external APIs)
reqwest = { version = "0.13.1", features = ["json"] }

# UUID (not used in database - removed from queries)
# uuid = { version = "1.0", features = ["v4", "serde"] }

# Regex for text processing
regex = "1.10"
rustls = "0.22"
webpki = "0.22"

tower_governor = "0.8.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1