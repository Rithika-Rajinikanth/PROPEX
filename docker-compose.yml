version: "3.9"

services:
  # ── PostgreSQL with PostGIS & pgvector ────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: propx-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Postgres@123
      POSTGRES_DB: propx_exchange
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/real_estate_api/propx_schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d propx_exchange"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── Redis 7 (Caching & WebSocket Channel Relay) ───────────────────────────
  redis:
    image: redis:7-alpine
    container_name: propx-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── Redpanda (C++ Native Kafka Engine - Zero JVM Overhead) ────────────────
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.11
    container_name: propx-redpanda
    command:
      - redpanda start
      - --smp 1
      - --memory 512M
      - --overprovisioned
      - --kafka-addr PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"
      - "9644:9644"
    restart: unless-stopped

  # ── Rust Core API Gateway & Matching Engine ───────────────────────────────
  backend:
    build:
      context: ./backend/real_estate_api
      dockerfile: backend.Dockerfile
    container_name: propx-backend
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://postgres:Postgres%40123@postgres:5432/propx_exchange?sslmode=disable
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: redpanda:9092
      PORT: "8080"
      HOST: "0.0.0.0"
      JWT_SECRET: super_secure_jwt_secret_propx_2026
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_started
    restart: unless-stopped

  # ── Python AI & Spatial Worker ────────────────────────────────────────────
  ai-worker:
    build:
      context: ./ml_service
      dockerfile: ml.Dockerfile
    container_name: propx-ai-worker
    environment:
      KAFKA_BROKERS: redpanda:9092
      DATABASE_URL: postgres://postgres:Postgres%40123@postgres:5432/propx_exchange?sslmode=disable
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      - redpanda
      - postgres
      - redis
    restart: unless-stopped

  # ── Next.js 16 Frontend ───────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend/real-estate-frontend
      dockerfile: frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
        NEXT_PUBLIC_WS_URL: ws://localhost:8080/ws
    container_name: propx-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
