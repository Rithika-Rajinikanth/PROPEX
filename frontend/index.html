<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Estate Market Intelligence</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.10.3/Recharts.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        
        * {
            font-family: 'Inter', sans-serif;
        }
        
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .card-hover {
            transition: all 0.3s ease;
        }
        
        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1);
        }
        
        .animate-fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .glass-effect {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const API_URL = 'http://localhost:3000/api/v1';

        // API Service
        const api = {
            async get(endpoint) {
                const response = await fetch(`${API_URL}${endpoint}`);
                if (!response.ok) throw new Error('Network response was not ok');
                return response.json();
            },
            
            async post(endpoint, data) {
                const response = await fetch(`${API_URL}${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                if (!response.ok) throw new Error('Network response was not ok');
                return response.json();
            }
        };

        // Navigation Component
        const Navigation = ({ currentTab, setCurrentTab }) => (
            <nav className="gradient-bg text-white shadow-lg">
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                    <div className="flex justify-between items-center h-16">
                        <div className="flex items-center space-x-2">
                            <svg className="w-8 h-8" fill="currentColor" viewBox="0 0 20 20">
                                <path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z" />
                            </svg>
                            <span className="text-xl font-bold">RealEstate Intelligence</span>
                        </div>
                        <div className="flex space-x-4">
                            {['Dashboard', 'Search', 'Analytics', 'Trends'].map(tab => (
                                <button
                                    key={tab}
                                    onClick={() => setCurrentTab(tab)}
                                    className={`px-4 py-2 rounded-lg transition-all ${
                                        currentTab === tab 
                                            ? 'bg-white text-purple-700 font-semibold' 
                                            : 'hover:bg-white/20'
                                    }`}
                                >
                                    {tab}
                                </button>
                            ))}
                        </div>
                    </div>
                </div>
            </nav>
        );

        // Dashboard Component
        const Dashboard = () => {
            const [stats, setStats] = useState({
                totalRegions: 0,
                avgPrice: 0,
                hotMarkets: 0
            });
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const fetchStats = async () => {
                    try {
                        const regions = await api.get('/regions?limit=100');
                        const trends = await api.get('/analytics/trends?limit=1');
                        
                        setStats({
                            totalRegions: regions.length,
                            avgPrice: trends[0]?.avg_value || 0,
                            hotMarkets: Math.floor(Math.random() * 50) + 20
                        });
                    } catch (error) {
                        console.error('Error fetching stats:', error);
                    } finally {
                        setLoading(false);
                    }
                };
                fetchStats();
            }, []);

            const StatCard = ({ title, value, icon, color }) => (
                <div className={`bg-white rounded-xl shadow-lg p-6 card-hover animate-fade-in`}>
                    <div className="flex items-center justify-between">
                        <div>
                            <p className="text-gray-500 text-sm font-medium">{title}</p>
                            <p className={`text-3xl font-bold mt-2 ${color}`}>
                                {loading ? '...' : value}
                            </p>
                        </div>
                        <div className={`${color} bg-opacity-10 p-4 rounded-lg`}>
                            {icon}
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="space-y-6">
                    <h1 className="text-3xl font-bold text-gray-900">Market Overview</h1>
                    
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <StatCard
                            title="Total Markets"
                            value={stats.totalRegions}
                            color="text-blue-600"
                            icon={<svg className="w-8 h-8" fill="currentColor" viewBox="0 0 20 20"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z" /></svg>}
                        />
                        <StatCard
                            title="Average Price"
                            value={`$${(stats.avgPrice / 1000).toFixed(0)}K`}
                            color="text-green-600"
                            icon={<svg className="w-8 h-8" fill="currentColor" viewBox="0 0 20 20"><path d="M8.433 7.418c.155-.103.346-.196.567-.267v1.698a2.305 2.305 0 01-.567-.267C8.07 8.34 8 8.114 8 8c0-.114.07-.34.433-.582zM11 12.849v-1.698c.22.071.412.164.567.267.364.243.433.468.433.582 0 .114-.07.34-.433.582a2.305 2.305 0 01-.567.267z" /><path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-13a1 1 0 10-2 0v.092a4.535 4.535 0 00-1.676.662C6.602 6.234 6 7.009 6 8c0 .99.602 1.765 1.324 2.246.48.32 1.054.545 1.676.662v1.941c-.391-.127-.68-.317-.843-.504a1 1 0 10-1.51 1.31c.562.649 1.413 1.076 2.353 1.253V15a1 1 0 102 0v-.092a4.535 4.535 0 001.676-.662C13.398 13.766 14 12.991 14 12c0-.99-.602-1.765-1.324-2.246A4.535 4.535 0 0011 9.092V7.151c.391.127.68.317.843.504a1 1 0 101.511-1.31c-.563-.649-1.413-1.076-2.354-1.253V5z" clipRule="evenodd" /></svg>}
                        />
                        <StatCard
                            title="Hot Markets"
                            value={stats.hotMarkets}
                            color="text-red-600"
                            icon={<svg className="w-8 h-8" fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M12.395 2.553a1 1 0 00-1.45-.385c-.345.23-.614.558-.822.88-.214.33-.403.713-.57 1.116-.334.804-.614 1.768-.84 2.734a31.365 31.365 0 00-.613 3.58 2.64 2.64 0 01-.945-1.067c-.328-.68-.398-1.534-.398-2.654A1 1 0 005.05 6.05 6.981 6.981 0 003 11a7 7 0 1011.95-4.95c-.592-.591-.98-.985-1.348-1.467-.363-.476-.724-1.063-1.207-2.03zM12.12 15.12A3 3 0 017 13s.879.5 2.5.5c0-1 .5-4 1.25-4.5.5 1 .786 1.293 1.371 1.879A2.99 2.99 0 0113 13a2.99 2.99 0 01-.879 2.121z" clipRule="evenodd" /></svg>}
                        />
                    </div>

                    <div className="bg-white rounded-xl shadow-lg p-6">
                        <h2 className="text-xl font-semibold mb-4">Quick Actions</h2>
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                            <button className="p-4 border-2 border-purple-200 rounded-lg hover:border-purple-500 hover:bg-purple-50 transition-all">
                                <svg className="w-8 h-8 mx-auto text-purple-600 mb-2" fill="currentColor" viewBox="0 0 20 20"><path d="M9 9a2 2 0 114 0 2 2 0 01-4 0z" /><path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-13a4 4 0 00-3.446 6.032l-2.261 2.26a1 1 0 101.414 1.415l2.261-2.261A4 4 0 1011 5z" clipRule="evenodd" /></svg>
                                <p className="text-sm font-medium">Search Properties</p>
                            </button>
                            <button className="p-4 border-2 border-blue-200 rounded-lg hover:border-blue-500 hover:bg-blue-50 transition-all">
                                <svg className="w-8 h-8 mx-auto text-blue-600 mb-2" fill="currentColor" viewBox="0 0 20 20"><path d="M2 11a1 1 0 011-1h2a1 1 0 011 1v5a1 1 0 01-1 1H3a1 1 0 01-1-1v-5zM8 7a1 1 0 011-1h2a1 1 0 011 1v9a1 1 0 01-1 1H9a1 1 0 01-1-1V7zM14 4a1 1 0 011-1h2a1 1 0 011 1v12a1 1 0 01-1 1h-2a1 1 0 01-1-1V4z" /></svg>
                                <p className="text-sm font-medium">View Analytics</p>
                            </button>
                            <button className="p-4 border-2 border-green-200 rounded-lg hover:border-green-500 hover:bg-green-50 transition-all">
                                <svg className="w-8 h-8 mx-auto text-green-600 mb-2" fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M6 2a1 1 0 00-1 1v1H4a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-1V3a1 1 0 10-2 0v1H7V3a1 1 0 00-1-1zm0 5a1 1 0 000 2h8a1 1 0 100-2H6z" clipRule="evenodd" /></svg>
                                <p className="text-sm font-medium">Market Trends</p>
                            </button>
                            <button className="p-4 border-2 border-red-200 rounded-lg hover:border-red-500 hover:bg-red-50 transition-all">
                                <svg className="w-8 h-8 mx-auto text-red-600 mb-2" fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M11.3 1.046A1 1 0 0112 2v5h4a1 1 0 01.82 1.573l-7 10A1 1 0 018 18v-5H4a1 1 0 01-.82-1.573l7-10a1 1 0 011.12-.38z" clipRule="evenodd" /></svg>
                                <p className="text-sm font-medium">Hot Markets</p>
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // Search Component
        const SearchComponent = () => {
            const [filters, setFilters] = useState({
                state: '',
                region_type: 'Metro',
                price_min: '',
                price_max: ''
            });
            const [results, setResults] = useState([]);
            const [loading, setLoading] = useState(false);

            const handleSearch = async () => {
                setLoading(true);
                try {
                    const params = new URLSearchParams();
                    if (filters.state) params.append('state', filters.state);
                    if (filters.region_type) params.append('region_type', filters.region_type);
                    if (filters.price_min) params.append('price_min', filters.price_min);
                    if (filters.price_max) params.append('price_max', filters.price_max);
                    params.append('limit', '20');

                    const data = await api.get(`/search?${params.toString()}`);
                    setResults(data.results || []);
                } catch (error) {
                    console.error('Search error:', error);
                    setResults([]);
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="space-y-6">
                    <h1 className="text-3xl font-bold text-gray-900">Property Search</h1>
                    
                    <div className="bg-white rounded-xl shadow-lg p-6">
                        <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">State</label>
                                <input
                                    type="text"
                                    value={filters.state}
                                    onChange={(e) => setFilters({...filters, state: e.target.value})}
                                    placeholder="e.g., NY, TX, CA"
                                    className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">Type</label>
                                <select
                                    value={filters.region_type}
                                    onChange={(e) => setFilters({...filters, region_type: e.target.value})}
                                    className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                >
                                    <option value="Metro">Metro</option>
                                    <option value="County">County</option>
                                    <option value="City">City</option>
                                </select>
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">Min Price ($)</label>
                                <input
                                    type="number"
                                    value={filters.price_min}
                                    onChange={(e) => setFilters({...filters, price_min: e.target.value})}
                                    placeholder="100000"
                                    className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">Max Price ($)</label>
                                <input
                                    type="number"
                                    value={filters.price_max}
                                    onChange={(e) => setFilters({...filters, price_max: e.target.value})}
                                    placeholder="1000000"
                                    className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                />
                            </div>
                        </div>
                        <button
                            onClick={handleSearch}
                            disabled={loading}
                            className="w-full gradient-bg text-white py-3 rounded-lg font-semibold hover:opacity-90 transition-opacity disabled:opacity-50"
                        >
                            {loading ? 'Searching...' : 'Search Properties'}
                        </button>
                    </div>

                    {results.length > 0 && (
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            {results.map((result, idx) => (
                                <div key={idx} className="bg-white rounded-xl shadow-lg p-6 card-hover animate-fade-in">
                                    <h3 className="text-lg font-semibold text-gray-900 mb-2">{result.region_name}</h3>
                                    <p className="text-sm text-gray-500 mb-4">{result.state_name}</p>
                                    {result.current_value && (
                                        <div className="mb-4">
                                            <p className="text-2xl font-bold text-purple-600">
                                                ${(parseFloat(result.current_value) / 1000).toFixed(0)}K
                                            </p>
                                            <p className="text-xs text-gray-500">Median Home Value</p>
                                        </div>
                                    )}
                                    <div className="space-y-2 text-sm">
                                        {result.inventory && (
                                            <div className="flex justify-between">
                                                <span className="text-gray-600">Inventory:</span>
                                                <span className="font-medium">{result.inventory}</span>
                                            </div>
                                        )}
                                        {result.sales_count && (
                                            <div className="flex justify-between">
                                                <span className="text-gray-600">Sales:</span>
                                                <span className="font-medium">{result.sales_count}</span>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}

                    {!loading && results.length === 0 && filters.state && (
                        <div className="text-center py-12">
                            <svg className="w-16 h-16 mx-auto text-gray-400 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                            </svg>
                            <p className="text-gray-500">No results found. Try different filters.</p>
                        </div>
                    )}
                </div>
            );
        };

        // Analytics Component
        const Analytics = () => {
            const [data, setData] = useState([]);
            const [selectedState, setSelectedState] = useState('NY');

            useEffect(() => {
                const fetchTrends = async () => {
                    try {
                        const trends = await api.get(`/analytics/trends?state=${selectedState}&limit=12`);
                        setData(trends.map(t => ({
                            date: new Date(t.date).toLocaleDateString('en-US', { month: 'short' }),
                            value: parseFloat(t.avg_value) / 1000
                        })));
                    } catch (error) {
                        console.error('Error fetching trends:', error);
                    }
                };
                fetchTrends();
            }, [selectedState]);

            return (
                <div className="space-y-6">
                    <div className="flex justify-between items-center">
                        <h1 className="text-3xl font-bold text-gray-900">Market Analytics</h1>
                        <select
                            value={selectedState}
                            onChange={(e) => setSelectedState(e.target.value)}
                            className="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500"
                        >
                            <option value="NY">New York</option>
                            <option value="TX">Texas</option>
                            <option value="CA">California</option>
                            <option value="FL">Florida</option>
                        </select>
                    </div>

                    <div className="bg-white rounded-xl shadow-lg p-6">
                        <h2 className="text-xl font-semibold mb-4">Price Trends (Last 12 Months)</h2>
                        <div className="h-80">
                            {data.length > 0 ? (
                                <div className="text-center text-gray-600 mt-20">
                                    <p>Average Price: ${data[data.length - 1]?.value.toFixed(0)}K</p>
                                    <p className="text-sm text-gray-500 mt-2">
                                        {data.length} months of data for {selectedState}
                                    </p>
                                </div>
                            ) : (
                                <div className="text-center text-gray-400 mt-20">Loading chart...</div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // Main App
        const App = () => {
            const [currentTab, setCurrentTab] = useState('Dashboard');

            return (
                <div className="min-h-screen bg-gray-50">
                    <Navigation currentTab={currentTab} setCurrentTab={setCurrentTab} />
                    <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        {currentTab === 'Dashboard' && <Dashboard />}
                        {currentTab === 'Search' && <SearchComponent />}
                        {currentTab === 'Analytics' && <Analytics />}
                        {currentTab === 'Trends' && <Analytics />}
                    </main>
                    <footer className="bg-white border-t mt-12">
                        <div className="max-w-7xl mx-auto px-4 py-6 text-center text-gray-600">
                            <p>© 2026 Real Estate Intelligence. Powered by advanced analytics.</p>
                        </div>
                    </footer>
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
