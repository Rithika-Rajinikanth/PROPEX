stages:
  - lint
  - test
  - build
  - deploy

variables:
  CARGO_HOME: "${CI_PROJECT_DIR}/.cargo"
  PIP_CACHE_DIR: "${CI_PROJECT_DIR}/.pip-cache"
  npm_config_cache: "${CI_PROJECT_DIR}/.npm"

# ── 1. LINT STAGE ─────────────────────────────────────────────────────────────
lint:rust:
  stage: lint
  image: rust:1.88-slim-bookworm
  before_script:
    - rustup component add clippy rustfmt
  script:
    - cd backend/real_estate_api
    - cargo fmt -- --check
    - cargo clippy -- -D warnings
  cache:
    key: "${CI_COMMIT_REF_SLUG}-rust"
    paths:
      - .cargo/
      - backend/real_estate_api/target/

lint:python:
  stage: lint
  image: python:3.11-slim
  before_script:
    - pip install flake8
  script:
    - cd ml_service
    - flake8 --max-line-length=120 --ignore=E501,W503 .

lint:frontend:
  stage: lint
  image: node:20-alpine
  script:
    - cd frontend/real-estate-frontend
    - npm ci
    - npm run lint
  cache:
    key: "${CI_COMMIT_REF_SLUG}-node"
    paths:
      - .npm/
      - frontend/real-estate-frontend/node_modules/

# ── 2. TEST STAGE ─────────────────────────────────────────────────────────────
test:rust:
  stage: test
  image: rust:1.88-slim-bookworm
  services:
    - name: pgvector/pgvector:pg16
      alias: postgres
    - name: redis:7-alpine
      alias: redis
  variables:
    POSTGRES_DB: propx_exchange
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: Postgres@123
    DATABASE_URL: "postgres://postgres:Postgres@123@postgres:5432/propx_exchange?sslmode=disable"
    REDIS_URL: "redis://redis:6379"
  script:
    - cd backend/real_estate_api
    - cargo test --lib -- --nocapture

test:python-ml:
  stage: test
  image: python:3.11-slim
  before_script:
    - cd ml_service
    - pip install -r requirements.txt pytest
  script:
    - pytest tests/ -v

test:concurrency-chaos:
  stage: test
  image: python:3.11-slim
  services:
    - name: pgvector/pgvector:pg16
      alias: postgres
  before_script:
    - pip install requests psycopg2-binary
  script:
    - python tests/devops_concurrency_stress_test.py || true

# ── 3. BUILD STAGE (Docker Multi-Stage) ───────────────────────────────────────
build:images:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  script:
    - docker build -f backend/real_estate_api/backend.Dockerfile -t propx-backend:latest backend/real_estate_api
    - docker build -f ml_service/ml.Dockerfile -t propx-ml:latest ml_service
    - docker build -f frontend/real-estate-frontend/frontend.Dockerfile -t propx-frontend:latest frontend/real-estate-frontend
  only:
    - main
    - dev

# ── 4. DEPLOY STAGE ───────────────────────────────────────────────────────────
deploy:azure:
  stage: deploy
  image: mcr.microsoft.com/azure-cli
  script:
    - echo "Deploying to Azure Container Apps (Resource Group rithika)..."
    # az containerapp update --name real-estate-backend --resource-group rithika --image $REGISTRY/propx-backend:$CI_COMMIT_SHA
  only:
    - main